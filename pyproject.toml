[project]
name = "handle-mcp"
version = "1.1.0"
description = "MCP server for Danish grocery delivery: search, cart and price comparison. You always pay yourself."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "keyring>=25",
    "tzdata>=2024.1; sys_platform == 'win32'",  # Windows has no IANA time zones for zoneinfo
]

[project.scripts]
handle-mcp = "handle_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/handle_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not live' -p pytester"
markers = ["live: calls real stores; needs HANDLE_LIVE=1 and logins"]

[tool.ruff]
line-length = 100
target-version = "py312"
